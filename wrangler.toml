"$schema" = "./node_modules/wrangler/config-schema.json"
name = "sparkido"
main = ".open-next/worker.js"
compatibility_date = "2025-05-20"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

# www Custom Domain은 Cloudflare Dashboard에서 추가 (기존 www DNS 레코드 삭제 후)

# OpenNext handler maps node:sqlite → require("sqlite"); Workers에는 npm 패키지 sqlite 없음
[alias]
sqlite = "./cloudflare-shims/sqlite.cjs"

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "sparkido"

[[d1_databases]]
binding = "DB"
database_name = "sparkido"
database_id = "be8a5d95-3f30-4016-bd26-50ac440580e5"
migrations_dir = "migrations"

[vars]
NEXT_PUBLIC_WWW_URL = "https://www.idosquare.co.kr"
NEXT_PUBLIC_INFO_URL = "https://info.idosquare.co.kr"
NEXT_PUBLIC_BOARD_URL = "https://board.idosquare.co.kr"
NEXT_PUBLIC_ADMIN_URL = "https://admin.idosquare.co.kr"
NEXT_PUBLIC_SPARK_URL = "https://spark.idosquare.co.kr"
NEXT_PUBLIC_SHOW_URL = "https://show.idosquare.co.kr"
NEXT_PUBLIC_LINK_URL = "https://link.idosquare.co.kr"
NEXT_PUBLIC_HELP_URL = "https://help.idosquare.co.kr"
NEXT_PUBLIC_CLERK_SIGN_IN_URL = "https://spark.idosquare.co.kr/sign-in"
NEXT_PUBLIC_CLERK_SIGN_UP_URL = "https://spark.idosquare.co.kr/sign-up"
